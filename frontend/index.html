          var loader = document.getElementById('app-loader');
          if (!loader) return;

          loader.style.transition = 'opacity 0.4s cubic-bezier(0.4,0,0.2,1)';
          loader.style.opacity = '0';
          loader.style.pointerEvents = 'none';

          setTimeout(function() {
            loader.style.display = 'none';
            try { loader.parentNode.removeChild(loader); } catch(e) {}
          }, 450);

          if (observer) try { observer.disconnect(); } catch(e) {}
          if (pollTimer) clearInterval(pollTimer);
        }

        // Method 1: window.load
        if (document.readyState === 'complete') {
          setTimeout(function() { killLoader('ready'); }, 500);
        } else {
          window.addEventListener('load', function() {
            setTimeout(function() { killLoader('load'); }, 600);
          }, { once: true });
        }

        // Method 2: MutationObserver watches React render
        try {
          var root = document.getElementById('root');
          if (root && typeof MutationObserver !== 'undefined') {
            observer = new MutationObserver(function(mutations) {
              for (var i = 0; i < mutations.length; i++) {
                if (mutations[i].addedNodes.length > 0) {
                  setTimeout(function() { killLoader('observer'); }, 200);
                  return;
                }
              }
            });
            observer.observe(root, { childList: true, subtree: false });
          }
        } catch(e) {}

        // Method 3: Polling fallback
        pollTimer = setInterval(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearInterval(pollTimer);
            setTimeout(function() { killLoader('poll'); }, 150);
          }
        }, 150);

        // Method 4: Hard timeout 5s
        setTimeout(function() { killLoader('timeout'); }, 5000);

        // Cleanup poll after 10s
        setTimeout(function() {
          if (pollTimer) clearInterval(pollTimer);
        }, 10000);

      })();
    </script>
  </body>
</html>
